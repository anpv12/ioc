# nginx — Dashboard Gia Lai (static prototype)
#
# Cách dùng:
#   1. Sửa root → đường dẫn tuyệt đối tới thư mục dự án (chứa index.html)
#   2. Include hoặc copy vào sites-enabled / conf.d
#   3. nginx -t && systemctl reload nginx
#
# URL:
#   /              → redirect /pages/home/
#   /pages/home/   → danh mục router
#   /pages/<tên>/  → từng trang

server {
    listen 80;
    server_name localhost;

    # Đổi thành đường dẫn thật trên server, ví dụ:
    # root /var/www/gialai-ioc;
    root REPLACE_WITH_ABS_PATH_TO_PROJECT;
    index index.html;

    charset utf-8;

    # / → home
    location = / {
        return 302 /pages/home/;
    }

    # Serve file tĩnh; directory → index.html trong folder
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache nhẹ cho asset
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Không list directory
    autoindex off;

    # Log (tuỳ chọn)
    access_log /var/log/nginx/gialai-ioc.access.log;
    error_log  /var/log/nginx/gialai-ioc.error.log;
}
